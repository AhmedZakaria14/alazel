name: Prepare unique article images
on:
  push:
    branches: [article-images-20261020]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/prepare-article-images.py
      - name: Save optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/articles
          if ! git diff --cached --quiet; then
            git commit -m "Add distinct optimized article illustrations"
            git push origin HEAD:article-images-20261020
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npx wrangler types --config tests/wrangler-types.json
      - run: npx tsc --noEmit
