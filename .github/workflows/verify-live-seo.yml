name: Verify published SEO release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  live-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-live-seo.py
